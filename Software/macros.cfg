# Coordination macros -- IDENTICAL on both toolheads.
[pause_resume]

[gcode_macro SYNC_STATE]
variable_completed_event: 0
gcode:

[gcode_macro COOP_NOTIFY]
description: Commit a completed coordination checkpoint
gcode:
    {% set event_index = params.EVENT_INDEX|default(0)|int %}
    M400
    SET_GCODE_VARIABLE MACRO=SYNC_STATE VARIABLE=completed_event VALUE={event_index}

[gcode_macro COOP_WAIT]
description: Retract, retreat to the park zone, and wait for a coordination event
variable_retract_mm: 2.0
variable_retract_feedrate: 2100
variable_park_feedrate: 3000
gcode:
    {% set park_x = params.PARK_X|float %}
    {% set park_y = params.PARK_Y|float %}
    {% set required_event = params.EVENT_INDEX|int %}
    {% if printer["gcode_macro SYNC_STATE"].completed_event|int < required_event %}
    {% set saved_x = printer.gcode_move.gcode_position.x|float %}
    {% set saved_y = printer.gcode_move.gcode_position.y|float %}
    SAVE_GCODE_STATE NAME=COOP_WAIT_STATE
    M83
    G1 E-{printer["gcode_macro COOP_WAIT"].retract_mm} F{printer["gcode_macro COOP_WAIT"].retract_feedrate}
    M82
    G90
    ; Z is deliberately untouched -- park applies no Z offset.
    G1 X{park_x} F{printer["gcode_macro COOP_WAIT"].park_feedrate}
    G1 Y{park_y} F{printer["gcode_macro COOP_WAIT"].park_feedrate}
    PAUSE
    G1 Y{saved_y} F{printer["gcode_macro COOP_WAIT"].park_feedrate}
    G1 X{saved_x} F{printer["gcode_macro COOP_WAIT"].park_feedrate}
    RESTORE_GCODE_STATE NAME=COOP_WAIT_STATE MOVE=0
    M83
    G1 E{printer["gcode_macro COOP_WAIT"].retract_mm} F{printer["gcode_macro COOP_WAIT"].retract_feedrate}
    M82
    {% endif %}

[gcode_macro COOP_DETOUR_BEGIN]
description: Bounded, offline-planned lateral detour (Sec. 6.7) instead of a full park
gcode:
    {% set offset_y = params.OFFSET_Y|float %}
    SET_GCODE_OFFSET Y={offset_y} MOVE=1

[gcode_macro COOP_DETOUR_END]
description: Clear a COOP_DETOUR_BEGIN offset
gcode:
    SET_GCODE_OFFSET Y=0 MOVE=1
